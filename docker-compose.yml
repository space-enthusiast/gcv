services:
  seaweed:
    image: chrislusf/seaweedfs:latest
    command: >
      server
      -s3
      -s3.config=/etc/seaweed/s3.json
      -dir=/data
    volumes:
      - seaweed-data:/data
      - ./seaweed/s3.json:/etc/seaweed/s3.json:ro
    ports:
      - "8333:8333"
      - "9333:9333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweed-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweed:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://seaweed:8333 s3 mb s3://gcv ||
        echo 'bucket may already exist'

volumes:
  seaweed-data:
